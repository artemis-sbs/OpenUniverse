name: Create Archive
on:
  push:
    tags:
      - "*"
jobs:
  # Single source of truth: the exposed addon (mastlib) list is read straight from
  # __lib__.json (universe_core, admiral, fabrication), so adding an addon there
  # automatically ships it - the matrix can never drift out of sync with the packaged
  # libs. OpenUniverse ships no media of its own (its missions reuse the
  # LegendaryMissions media zip), so there is no media job.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@master
      - name: Build addon matrix from __lib__.json
        id: set
        run: echo "matrix=$(jq -c '.mastlib' __lib__.json)" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: setup

    strategy:
      matrix:
        item: ${{ fromJson(needs.setup.outputs.matrix) }}

    env:
      # Name it exactly what `sbs lib` writes into __lib__ and what a mission's
      # story.json refers to: {owner}.{repo}.{addon}.{tag}.mastlib. Publishing the bare
      # addon name meant no consumer could resolve it - every fetch 404'd and fell back
      # to whatever happened to be on disk.
      ASSET: ${{ github.repository_owner }}.${{ github.event.repository.name }}.${{ matrix.item }}.${{ github.ref_name }}.mastlib

    steps:
      - uses: actions/checkout@master

      # FLAT, and that is load-bearing: MAST opens the .mastlib and reads `__init__.mast`
      # at the ZIP ROOT. The old `zip-release` step passed `path: <addon>`, which nests the
      # folder, so the archive held `<addon>/__init__.mast`, the open raised, and the addon
      # silently never loaded - zero labels, and the headless test still reported PASS.
      - name: Archive addon (flat, matching `sbs lib`)
        env:
          SRC: ${{ matrix.item }}
        run: python .github/zip_flat.py "$SRC" "$ASSET"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: '${{ matrix.item }}'
          path: ${{ env.ASSET }}
          retention-days: 1

  build_release:
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts # Download all artifacts to this directory

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: artifacts/*/*
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
