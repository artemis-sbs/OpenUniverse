name: Create Archive
on:
  push:
    tags:
      - "*"
jobs:
  # Single source of truth: the exposed addon (mastlib) list is read straight from
  # __lib__.json (universe_core, admiral, fabrication), so adding an addon there
  # automatically ships it - the matrix can never drift out of sync with the packaged
  # libs. OpenUniverse ships no media of its own (its missions reuse the
  # LegendaryMissions media zip), so there is no media job.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@master
      - name: Build addon matrix from __lib__.json
        id: set
        run: echo "matrix=$(jq -c '.mastlib' __lib__.json)" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: setup

    strategy:
      matrix:
        item: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - name: Set env version
        id: get_version
        run: echo ::set-output name=VERSION::${GITHUB_REF/refs\/tags\//}

      - uses: actions/checkout@master
      - name: Archive addon
        uses: thedoctor0/zip-release@main
        with:
          type: 'zip'
          filename: '${{ matrix.item }}.${{ steps.get_version.outputs.VERSION }}.mastlib'
          path: "${{ matrix.item }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: '${{ matrix.item }}'
          path: '${{ matrix.item }}.${{ steps.get_version.outputs.VERSION }}.mastlib'
          retention-days: 1

  build_release:
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts # Download all artifacts to this directory

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: artifacts/*/*
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
